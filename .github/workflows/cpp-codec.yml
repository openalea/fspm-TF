# The C++ codec (bindings/cpp): its tests on Linux, macOS and Windows; the conformance check other codecs run (its
# dumps of the conformance files compared with their expected values, the files it writes validated); the coupling
# conformance sessions. No platform: CPlantBox's adapter (bindings/cpp/cplantbox), a proposal for CPlantBox, is tested
# by hand (bindings/cpp/cplantbox/README.md). OpenAlea's conda CI builds the Python package only.
name: C++ codec

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (nlohmann_json fetched)
        run: cmake -S bindings/cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump and write the conformance scenes with the C++ codec
        run: |
          cmake -S bindings/cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target encoding3d_conformance_run
          ./build/encoding3d_conformance_run conformance out
      - uses: ./.github/actions/conformance
        with:
          dumps: out/dumps
          written: out/written
      # the coupling conformance sessions (specification §9, §11): the C++ participant, over ZeroMQ (libzmq) and a folder
      - name: The coupling conformance sessions
        run: |
          sudo apt-get install -y -q libzmq3-dev
          cmake -S bindings/cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target encoding3d_coupling_conformance
          python -m pip install numpy jsonschema pyzmq .
          encoding3d couple-conformance conformance/coupling --participant "$PWD/build/encoding3d_coupling_conformance"


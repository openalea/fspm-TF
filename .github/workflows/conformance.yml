# The conformance files are valid glTF for every viewer (Khronos' glTF-Validator) and valid encoding3d (our validator)
name: Conformance

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GLTF_VALIDATOR: 2.0.0-dev.3.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openalea.encoding3d (its dependencies, conda-only in pyproject.toml, given here), and VTK for the ParaView reader's tests
        run: python -m pip install numpy jsonschema pytest pyzmq vtk . 
      - name: Tests, the ParaView reader's conversion included
        run: pytest bindings/python/test -v
      - name: The committed files are the generated ones
        run: |
          python conformance/generate.py
          git diff --exit-code -- conformance
      - name: encoding3d validator
        run: encoding3d validate conformance/*.glb conformance/growing_sequence/scene.fspm.json
      - name: Khronos glTF-Validator
        run: |
          curl -sSL -o validator.tar.xz "https://github.com/KhronosGroup/glTF-Validator/releases/download/${GLTF_VALIDATOR}/gltf_validator-${GLTF_VALIDATOR}-linux64.tar.xz"
          tar xf validator.tar.xz gltf_validator
          for file in conformance/*.glb conformance/growing_sequence/*.glb; do
            ./gltf_validator "$file" || exit 1
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openalea.encoding3d and the documentation's tools
        run: |
          sudo apt-get install -y pandoc
          python -m pip install numpy jsonschema pytest sphinx ".[doc]"
      - name: The notebooks run
        run: python -m pytest --nbmake doc/notebooks tutorials/01_encoding3d_alone
      - name: Build the documentation, warnings as errors
        run: python -m sphinx -b html doc doc/_build -W --keep-going

  # The reference codec through the action other codecs use: its dumps of the conformance files, and the files it writes
  python-codec-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dump and write the conformance scenes with the Python codec
        run: |
          python -m pip install numpy jsonschema .
          python bindings/python/conformance_run.py conformance out
      - uses: ./.github/actions/conformance
        with:
          dumps: out/dumps
          written: out/written

# The conformance files are valid glTF for every viewer (Khronos' glTF-Validator) and valid fspm-TF (our validator)
name: Conformance

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GLTF_VALIDATOR: 2.0.0-dev.3.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openalea.fspm_tf, and VTK for the ParaView reader's tests
        run: python -m pip install . pytest vtk
      - name: Tests, the ParaView reader's conversion included
        run: pytest bindings/python/test -v
      - name: The committed files are the generated ones
        run: |
          python conformance/generate.py
          git diff --exit-code -- conformance
      - name: fspm-TF validator
        run: fspm-tf validate conformance/*.glb conformance/growing_sequence/scene.fspm.json
      - name: Khronos glTF-Validator
        run: |
          curl -sSL -o validator.tar.xz "https://github.com/KhronosGroup/glTF-Validator/releases/download/${GLTF_VALIDATOR}/gltf_validator-${GLTF_VALIDATOR}-linux64.tar.xz"
          tar xf validator.tar.xz gltf_validator
          for file in conformance/*.glb conformance/growing_sequence/*.glb; do
            ./gltf_validator "$file" || exit 1
          done

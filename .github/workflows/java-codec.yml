# The Java codec (bindings/java): its tests on Linux, macOS and Windows; the conformance check other codecs run; the
# coupling conformance sessions. No platform: GroIMP's adapter and plugin (bindings/java/groimp, groimp-plugin),
# proposals for GroIMP, are tested by hand (their README.md). OpenAlea's conda CI builds the Python package only.
name: Java codec

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tests, the conformance files included
        run: mvn -B -f bindings/java/pom.xml verify

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Dump and write the conformance scenes with the Java codec
        run: |
          mvn -B -q -f bindings/java/pom.xml package -DskipTests dependency:copy-dependencies -DincludeScope=runtime
          java -cp "bindings/java/target/encoding3d-0.1.0.jar:bindings/java/target/dependency/*" org.openalea.encoding3d.ConformanceRun conformance out
      - uses: ./.github/actions/conformance
        with:
          dumps: out/dumps
          written: out/written
      # the coupling conformance sessions (specification §9, §11): the Java participant, over ZeroMQ (JeroMQ) and a folder
      - name: The coupling conformance sessions
        run: |
          python -m pip install pyzmq
          encoding3d couple-conformance conformance/coupling --participant \
            "java -cp $PWD/bindings/java/target/encoding3d-0.1.0.jar:$PWD/bindings/java/target/dependency/* org.openalea.encoding3d.coupling.ConformanceParticipant"


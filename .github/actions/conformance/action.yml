# Checks a codec against fspm-TF's conformance files, in a codec's own CI, once the codec has run:
#
#   - uses: ./.github/actions/conformance            (in this repository; elsewhere openalea/fspm-TF/.github/actions/conformance@main)
#     with:
#       dumps: out/dumps          # what the codec read: one JSON dump per conformance GLB, x.json for x.expected.json
#       written: out/written      # what the codec wrote: the conformance scenes, as .glb files (optional)
#
# Reading passes when every dump equals its expected values; writing, when every written file passes fspm-tf validate
# and Khronos' glTF-Validator with no error.
name: fspm-TF conformance
description: Compare a codec's reading of the conformance files with their expected values, and validate what it wrote
inputs:
  dumps:
    description: the folder of the codec's JSON dumps of the conformance files
    required: true
  written:
    description: the folder of the .glb files the codec wrote for the conformance scenes (empty to skip)
    required: false
    default: ""
  fspm-tf:
    description: the path of an fspm-TF checkout (its conformance folder and Python package)
    required: false
    default: "."
  gltf-validator:
    description: the version of Khronos' glTF-Validator
    required: false
    default: "2.0.0-dev.3.10"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install openalea.fspm_tf
      shell: bash
      run: python -m pip install numpy jsonschema "${{ inputs.fspm-tf }}"
    - name: Reading
      shell: bash
      run: fspm-tf compare-all "${{ inputs.dumps }}" "${{ inputs.fspm-tf }}/conformance"
    - name: Writing, fspm-TF validator
      if: inputs.written != ''
      shell: bash
      run: find "${{ inputs.written }}" -name "*.glb" -print0 | xargs -0 fspm-tf validate
    - name: Writing, Khronos' glTF-Validator
      if: inputs.written != '' && runner.os == 'Linux'
      shell: bash
      run: |
        curl -sSL -o validator.tar.xz "https://github.com/KhronosGroup/glTF-Validator/releases/download/${{ inputs.gltf-validator }}/gltf_validator-${{ inputs.gltf-validator }}-linux64.tar.xz"
        tar xf validator.tar.xz gltf_validator
        find "${{ inputs.written }}" -name "*.glb" -print0 | xargs -0 -n1 ./gltf_validator

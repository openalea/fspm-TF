[build-system]
requires = [
    "setuptools",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false # force explicit declaration of data (disable automatic inclusion)
# the code in bindings/python/src; the specification (spec/: its text, schemas and vocabulary) shipped as
# openalea.fspm_tf.spec. This file stays at the root, next to spec/ (a project cannot ship files outside its folder)
packages = ["openalea.fspm_tf", "openalea.fspm_tf.spec"]
package-dir = {"" = "bindings/python/src", "openalea.fspm_tf.spec" = "spec"}

[tool.setuptools.package-data]
"openalea.fspm_tf.spec" = ["*.md", "schema/*.json", "vocabulary/*.csv", "vocabulary/*.json"]

# enable dynamic version based on git tags
[tool.setuptools_scm]

[project]
name = "openalea.fspm_tf"
authors = [
  { name = "Tristan Gérault", email = "tristan.gerault@inrae.fr" },
]
description = "fspm-TF, an exchange format for whole FSPM scenes: its Python reference codec, validator and vocabulary"
readme = "README.md"
license = "CECILL-C"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Framework :: OpenAlea",
]

# you can list here all dependencies that are pip-instalable, and that have a name identical to the one used by conda (to allow reuse of this list in meta.yaml)
# If conda name is different, please do not declare the pip name, and declare conda name in the next section
dependencies = [
    "numpy",
    "jsonschema",
]

# section specific to conda-only distributed package (not used by pip yet)
[tool.conda.environment]

dependencies = []

[project.optional-dependencies]
test = [
  "pytest",
]
dev = [
  "pytest >=6",
  "pytest-cov >=3",
]

[project.scripts]
fspm-tf = "openalea.fspm_tf.cli:main"

[project.urls]
Repository = "https://github.com/openalea/fspm-TF"
Homepage = "https://github.com/openalea/fspm-TF"

[tool.coverage.run]
source = ["openalea.fspm_tf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["bindings/python/test"]

[build-system]
requires = [
    "setuptools",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false # force explicit declaration of data (disable automatic inclusion)
# the code in bindings/python/src; the specification (spec/: its text, schemas and vocabulary) shipped as
# openalea.encoding3d.spec. This file stays at the root, next to spec/ (a project cannot ship files outside its folder)
packages = ["openalea.encoding3d", "openalea.encoding3d.coupling", "openalea.encoding3d.spec"]
package-dir = {"" = "bindings/python/src", "openalea.encoding3d.spec" = "spec"}

[tool.setuptools.package-data]
"openalea.encoding3d.spec" = ["*.md", "schema/*.json", "vocabulary/*.csv", "vocabulary/*.json"]

# enable dynamic version based on git tags
[tool.setuptools_scm]

[project]
name = "openalea.encoding3d"
authors = [
  { name = "Tristan Gérault", email = "tristan.gerault@inrae.fr" },
]
description = "encoding3d, an exchange format for whole FSPM scenes, with its Python reference codec, validator and vocabulary"
readme = "README.md"
license = "CECILL-C"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Framework :: OpenAlea",
]

# you can list here all dependencies that are pip-instalable, and that have a name identical to the one used by conda (to allow reuse of this list in meta.yaml)
# If conda name is different, please do not declare the pip name, and declare conda name in the next section
dependencies = []

# section specific to conda-only distributed package (not used by pip yet)
[tool.conda.environment]

dependencies = [
    "numpy",
    "jsonschema",
]

[project.optional-dependencies]
coupling = [
  "pyzmq",               # the coupling's in-memory transport (openalea.encoding3d.coupling); its folder transport needs nothing
]
test = [
  "pytest",
  "pyzmq",
]
dev = [
  "pytest >=6",
  "pytest-cov >=3",
]
doc = [
  "pydata-sphinx-theme",
  "myst-parser",
  "sphinx-favicon",
  "ipykernel",
  "sphinx-copybutton",
  "ipython_genutils",
  "nbsphinx",
  "nbmake",              # the notebooks are tested: pytest --nbmake doc/notebooks
  "pandas",              # the notebooks' tables
]

[project.scripts]
encoding3d = "openalea.encoding3d.cli:main"

[project.urls]
Repository = "https://github.com/openalea/encoding3d"
Homepage = "https://github.com/openalea/encoding3d"

[tool.coverage.run]
source = ["openalea.encoding3d"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["bindings/python/test"]

{% set pyproject = load_file_data('../pyproject.toml', from_recipe_dir=True) %}
{% set name = pyproject.get('project').get('name') %}
{% set description = pyproject.get('project').get('description') %}
{% set version = environ.get('SETUPTOOLS_SCM_PRETEND_VERSION', "0.0.0.dev") %}
{% set license = pyproject.get('project').get('license') %}
{% set home = pyproject.get('project', {}).get('urls', {}).get('Repository', '') %}
{% set build_deps = pyproject.get("build-system", {}).get("requires", []) %}
{% set deps = pyproject.get('project', {}).get('dependencies', []) %}
{% set test_deps = pyproject.get('project', {}).get('optional-dependencies', {}).get('test',[]) %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  string: py{{ PY_VER }}
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-build-isolation -vv
  entry_points:
    - fspm-tf = fspm_tf.cli:main

requirements:
  build:
    - python
    {% for dep in build_deps %}
    - {{ dep }}
    {% endfor  %}

  run:
    - python
    {% for dep in deps %}
    - {{ dep }}
    {% endfor %}

test:
  requires:
    {% for dep in test_deps %}
    - {{ dep }}
    {% endfor %}

  imports:
    - fspm_tf

  source_files:
    - test/**
    - conformance/**                            # the reference files the tests check, and their generator

  commands:
    - fspm-tf --help
    - cd test
    - pytest -v

about:
  home: {{ home }}
  summary: {{ description }}
  license: {{ license }}

extra:
  recipe-maintainers:
    - GeraultTr

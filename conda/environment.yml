name: encoding3d
channels:
  - openalea3
  - conda-forge
dependencies:
  - python
  - pip
  - pandoc                # the documentation's notebooks (nbsphinx)
  - numpy
  - jsonschema
  - pytest
  # the package from the sources, with the documentation's and the tests' tools (also what readthedocs builds with)
  - pip:
      - -e ..[doc,test]
